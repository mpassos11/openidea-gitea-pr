[package]
name = "openidea-plugin-gitea-pr"
version = "0.1.2"
edition = "2024"
description = "Gitea pull request control for OpenIDEA: open, review, comment, merge."
authors = ["Matheus"]
license = "MIT"
homepage = "https://github.com/l0ng-ai/openidea"
categories = ["vcs", "tools"]

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Inside a checkout of openidea, depend on the SDK by path:
openidea-plugin = { path = "C:/wamp/www/openidea-repo/sdk/rust/openidea-plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
