<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gitea Pull Requests</title>
<style>
  :root {
    --bg: #1a1a1e; --surface: #222228; --surface-2: #2a2a31; --border: #2f2f37;
    --fg: #e6e6ea; --muted: #8a8a94; --accent: #5b8def; --accent-soft: rgba(91,141,239,0.14);
    --danger: #e06c75; --success: #98c379; --warn: #e5c07b; --radius: 6px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; font-size: 13px; line-height: 1.45; color: var(--fg); background: var(--bg); padding: 12px; -webkit-font-smoothing: antialiased; }
  h1 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  h1::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; display: inline-block; }
  .toolbar { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); padding: 4px 8px; border-radius: var(--radius); font-size: 12px; }
  .toolbar button { background: var(--accent); color: #fff; border: 0; padding: 4px 10px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500; }
  .toolbar button.secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); }
  .toolbar button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .toolbar button.ghost.active { color: var(--accent); border-color: var(--accent); }
  .filters { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .filters button { background: var(--surface); color: var(--muted); border: 1px solid var(--border); padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 500; }
  .filters button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #list { display: flex; flex-direction: column; gap: 8px; }
  .pr { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px; }
  .pr:hover { border-color: #3a3a44; }
  .pr .title { font-weight: 600; font-size: 13px; margin-bottom: 4px; word-break: break-word; }
  .pr .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 2px; line-height: 1.4; word-break: break-word; }
  .pr .detail { font-size: 12px; color: var(--fg); margin-top: 6px; padding: 6px 8px; background: var(--surface-2); border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow: auto; }
  .pr .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .pr .actions button { background: var(--accent); color: #fff; border: 0; padding: 4px 10px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 500; }
  .pr .actions button.secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); }
  .pr .actions button.danger { background: var(--danger); }
  .pr .actions button.success { background: var(--success); color: #1a1a1e; }
  .pr .actions button.warn { background: var(--warn); color: #1a1a1e; }
  .pr .actions input, .pr .actions select { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); padding: 4px 8px; border-radius: var(--radius); font-size: 12px; }
  .status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; vertical-align: middle; }
  .status.success { background: var(--success); }
  .status.failure { background: var(--danger); }
  .status.pending { background: var(--warn); }
  .status.unknown { background: var(--muted); }
  a.link { color: var(--accent); font-size: 11.5px; text-decoration: none; margin-left: auto; }
  a.link:hover { text-decoration: underline; }
  #empty { color: var(--muted); font-style: italic; font-size: 12px; padding: 16px 0; text-align: center; }
  .error { color: var(--danger); font-size: 12px; padding: 8px 10px; background: rgba(224,108,117,0.1); border: 1px solid rgba(224,108,117,0.3); border-radius: var(--radius); margin-bottom: 8px; }
  .badge { font-size: 10px; padding: 1px 6px; border-radius: 999px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); margin-left: 6px; }
</style>
</head>
<body>
  <h1>Pull Requests</h1>
  <div class="toolbar">
    <button id="create">+ Novo PR</button>
    <input id="filterAuthor" placeholder="autor\u2026" />
    <input id="filterLabel" placeholder="label\u2026" />
    <button id="autoRefresh" class="ghost" title="Auto-refresh 30s">Auto</button>
    <button id="refresh" class="secondary">Atualizar</button>
  </div>
  <div class="filters" role="tablist">
    <button data-state="open" class="active" role="tab">Abertos</button>
    <button data-state="closed" role="tab">Fechados</button>
    <button data-state="all" role="tab">Todos</button>
  </div>
  <div id="error" class="error" hidden></div>
  <div id="list"></div>
  <div id="empty" style="display:none">Carregando\u2026</div>
  <script>
    let currentState = 'open';
    let autoTimer = null;
    let allPrs = [];
    function txt(s){ return (s == null ? '' : String(s)); }
    function esc(s){ return txt(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function makePr(p) {
      const wrap = document.createElement('div');
      wrap.className = 'pr';
      const title = document.createElement('div');
      title.className = 'title';
      const statusSpan = document.createElement('span');
      statusSpan.className = 'status unknown';
      statusSpan.id = 'st-' + p.number;
      title.appendChild(statusSpan);
      title.appendChild(document.createTextNode('#' + (Number.isInteger(p.number)?p.number:'') + ' ' + txt(p.title)));
      wrap.appendChild(title);
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = txt(p.state) + ' \u00b7 ' + txt(p.user && p.user.login) + ' \u00b7 ' + txt(p.head && p.head.label) + ' \u2192 ' + txt(p.base && p.base.label);
      wrap.appendChild(meta);
      const meta2 = document.createElement('div');
      meta2.className = 'meta';
      const labels = (p.labels || []).map(l => txt(l && l.name)).filter(Boolean).join(', ') || '-';
      const reviewers = (p.requested_reviewers || []).map(r => txt(r && r.login)).filter(Boolean).join(', ') || '-';
      meta2.textContent = 'labels: ' + labels + ' \u00b7 reviewers: ' + reviewers;
      wrap.appendChild(meta2);
      // detail (hidden)
      const detail = document.createElement('div');
      detail.className = 'detail';
      detail.style.display = 'none';
      detail.textContent = txt(p.body);
      wrap.appendChild(detail);
      const actions = document.createElement('div');
      actions.className = 'actions';
      function btn(label, cls, handler) {
        const b = document.createElement('button');
        b.textContent = label;
        if (cls) b.className = cls;
        b.addEventListener('click', handler);
        return b;
      }
      actions.appendChild(btn('Diff', 'secondary', () => act('diff', p.number)));
      const mergeSel = document.createElement('select');
      ['merge','squash','rebase'].forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; mergeSel.appendChild(o); });
      actions.appendChild(mergeSel);
      const mergeBtn = btn('Merge', '', () => act('merge', p.number, mergeSel.value));
      actions.appendChild(mergeBtn);
      if (p.state === 'open') {
        actions.appendChild(btn('Fechar', 'danger', () => act('close', p.number)));
      } else {
        actions.appendChild(btn('Reabrir', 'success', () => act('reopen', p.number)));
      }
      actions.appendChild(btn('Editar', 'secondary', () => editPr(p)));
      const reviewSel = document.createElement('select');
      ['APPROVE','REQUEST_CHANGES','COMMENT'].forEach(e => { const o = document.createElement('option'); o.value = e; o.textContent = e; reviewSel.appendChild(o); });
      actions.appendChild(reviewSel);
      const reviewBtn = btn('Review', 'secondary', () => {
        const r = prompt('Coment\u00e1rio (opcional):');
        if (r === null) return;
        act('review', p.number, reviewSel.value, r);
      });
      actions.appendChild(reviewBtn);
      actions.appendChild(btn('Reviewers', 'secondary', () => {
        const r = prompt('Reviewers (login, separados por v\u00edrgula):');
        if (r === null) return;
        const list = r.split(',').map(x=>x.trim()).filter(Boolean);
        act('request-reviewers', p.number, list);
      }));
      const detBtn = btn('Detalhes', 'secondary', () => {
        detail.style.display = detail.style.display === 'none' ? 'block' : 'none';
      });
      actions.appendChild(detBtn);
      if (p.html_url) {
        const a = document.createElement('a');
        a.className = 'link';
        a.href = txt(p.html_url);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'abrir';
        actions.appendChild(a);
      }
      wrap.appendChild(actions);
      // fetch status
      if (p.head && p.head.sha) {
        act('statuses', null, null, null, p.head.sha);
      }
      return wrap;
    }
    function render(prs) {
      const el = document.getElementById('list');
      const empty = document.getElementById('empty');
      el.textContent = '';
      const author = document.getElementById('filterAuthor').value.trim().toLowerCase();
      const label = document.getElementById('filterLabel').value.trim().toLowerCase();
      let filtered = (Array.isArray(prs) ? prs : []).filter(p => {
        if (author && !txt(p.user && p.user.login).toLowerCase().includes(author)) return false;
        if (label && !(p.labels||[]).some(l => txt(l && l.name).toLowerCase().includes(label))) return false;
        return true;
      });
      if (!filtered.length) { empty.textContent = 'Nenhum PR.'; empty.style.display = 'block'; return; }
      empty.style.display = 'none';
      const frag = document.createDocumentFragment();
      filtered.forEach(p => frag.appendChild(makePr(p)));
      el.appendChild(frag);
    }
    function showError(m) {
      const e = document.getElementById('error');
      if (!e) return;
      e.textContent = m ? ('Erro: ' + m) : '';
      e.hidden = !m;
    }
    function act(op, number, extra, body, sha) {
      showError('');
      const payload = { op: op };
      if (Number.isInteger(number)) payload.number = number;
      if (extra != null) {
        if (op === 'merge') payload.method = extra;
        if (op === 'review') payload.event = extra;
        if (op === 'request-reviewers') payload.reviewers = extra;
      }
      if (body != null && op === 'review') payload.body = body;
      if (sha != null && op === 'statuses') payload.sha = sha;
      try { openidea.postMessage(JSON.stringify(payload)); } catch (e) {}
    }
    function editPr(p) {
      const t = prompt('Novo t\u00edtulo:', txt(p.title));
      if (t === null) return;
      const b = prompt('Novo body:', txt(p.body));
      if (b === null) return;
      try { openidea.postMessage(JSON.stringify({ op: 'edit', number: p.number, title: t, body: b })); } catch (e) {}
    }
    function refresh() {
      showError('');
      const empty = document.getElementById('empty');
      if (empty) { empty.textContent = 'Carregando\u2026'; empty.style.display = 'block'; }
      try { openidea.postMessage(JSON.stringify({ op: 'list', state: currentState })); } catch (e) {}
    }
    document.querySelectorAll('.filters button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        currentState = b.dataset.state;
        refresh();
      });
    });
    document.getElementById('filterAuthor').addEventListener('input', () => render(allPrs));
    document.getElementById('filterLabel').addEventListener('input', () => render(allPrs));
    document.getElementById('create').addEventListener('click', () => {
      const r = prompt('T\u00edtulo do PR (vazio = \u00faltimo commit):');
      if (r === null) return;
      try { openidea.postMessage(JSON.stringify({ op: 'create', title: r })); } catch (e) {}
    });
    document.getElementById('autoRefresh').addEventListener('click', (e) => {
      const btn = e.target;
      if (autoTimer) { clearInterval(autoTimer); autoTimer = null; btn.classList.remove('active'); }
      else { autoTimer = setInterval(refresh, 30000); btn.classList.add('active'); }
    });
    openidea.onMessage((raw) => {
      try {
        const msg = JSON.parse(raw);
        if (msg.op === 'prs') {
          let prs = [];
          try { prs = JSON.parse(msg.data); } catch (e) { prs = []; }
          allPrs = prs;
          render(prs);
        }
        if (msg.op === 'statuses') {
          const el = document.getElementById('st-' + (msg.sha ? '' : ''));
          // update any matching status by sha not available in DOM; skip
        }
        if (msg.op === 'error') {
          showError(msg.message || 'erro desconhecido');
          const empty = document.getElementById('empty');
          if (empty) empty.style.display = 'none';
        }
      } catch (e) {}
    });
    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
