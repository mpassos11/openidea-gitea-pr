<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gitea Pull Requests</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; color: #ddd; background: #1e1e1e; }
  h2 { margin: 0 0 8px; font-size: 14px; }
  .pr { padding: 8px; border-bottom: 1px solid #333; }
  .pr .title { font-weight: 600; }
  .pr .meta { font-size: 12px; color: #999; }
  button { background: #2d6cdf; color: #fff; border: 0; padding: 6px 10px; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  #empty { color: #999; font-style: italic; }
</style>
</head>
<body>
  <h2>Open Pull Requests</h2>
  <div id="list"></div>
  <div id="empty">Loading…</div>
  <button id="refresh">Refresh</button>
  <script>
    function render(prs) {
      const el = document.getElementById('list');
      const empty = document.getElementById('empty');
      if (!prs || !prs.length) { el.innerHTML = ''; empty.textContent = 'No open PRs.'; return; }
      empty.textContent = '';
      el.innerHTML = prs.map(p =>
        `<div class="pr">
          <div class="title">#${p.number} ${escape(p.title)}</div>
          <div class="meta">${p.state} · ${p.user.login} · ${p.head.label} → ${p.base.label}</div>
          <a href="${p.html_url}" target="_blank" style="color:#6ea8fe;font-size:12px;">open in browser</a>
        </div>`).join('');
    }
    function escape(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
    function refresh() {
      try { openidea.postMessage(JSON.stringify({ op: 'refresh' })); } catch (e) {}
    }
    openidea.onMessage((raw) => {
      try {
        const msg = JSON.parse(raw);
        if (msg.op === 'prs') {
          let prs = [];
          try { prs = JSON.parse(msg.data); } catch (e) { prs = []; }
          render(prs);
        }
      } catch (e) {}
    });
    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
