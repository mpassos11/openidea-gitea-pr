<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Gitea Pull Requests</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; color: #ddd; background: #1e1e1e; }
  h2 { margin: 0 0 8px; font-size: 14px; }
  .pr { padding: 8px; border-bottom: 1px solid #333; }
  .pr .title { font-weight: 600; }
  .pr .meta { font-size: 12px; color: #999; }
  .pr .actions { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { background: #2d6cdf; color: #fff; border: 0; padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  button.secondary { background: #444; }
  input.comment { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 4px 6px; border-radius: 4px; font-size: 12px; width: 60%; }
  #empty { color: #999; font-style: italic; }
  .filters { margin-bottom: 8px; display: flex; gap: 6px; }
  .filters button { background: #444; }
  .filters button.active { background: #2d6cdf; }
  a.link { color: #6ea8fe; font-size: 12px; }
</style>
</head>
<body>
  <h2>Open Pull Requests</h2>
  <div class="filters">
    <button data-state="open" class="active">Open</button>
    <button data-state="closed">Closed</button>
    <button data-state="all">All</button>
  </div>
  <div id="list"></div>
  <div id="empty">Loading…</div>
  <button id="refresh" class="secondary">Refresh</button>
  <script>
    let currentState = 'open';
    function txt(s){ return (s == null ? '' : String(s)); }
    function makePr(p) {
      const wrap = document.createElement('div');
      wrap.className = 'pr';

      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = '#' + (Number.isInteger(p.number) ? p.number : '') + ' ' + txt(p.title);
      wrap.appendChild(title);

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = txt(p.state) + ' · ' + txt(p.user && p.user.login) + ' · ' + txt(p.head && p.head.label) + ' → ' + txt(p.base && p.base.label);
      wrap.appendChild(meta);

      const meta2 = document.createElement('div');
      meta2.className = 'meta';
      const labels = (p.labels || []).map(l => txt(l && l.name)).filter(Boolean).join(', ') || '-';
      const reviewers = (p.requested_reviewers || []).map(r => txt(r && r.login)).filter(Boolean).join(', ') || '-';
      meta2.textContent = 'labels: ' + labels + ' · reviewers: ' + reviewers;
      wrap.appendChild(meta2);

      const actions = document.createElement('div');
      actions.className = 'actions';

      const diffBtn = document.createElement('button');
      diffBtn.textContent = 'Diff';
      diffBtn.addEventListener('click', () => act('diff', p.number));
      actions.appendChild(diffBtn);

      const mergeBtn = document.createElement('button');
      mergeBtn.className = 'secondary';
      mergeBtn.textContent = 'Merge';
      mergeBtn.addEventListener('click', () => act('merge', p.number));
      actions.appendChild(mergeBtn);

      const input = document.createElement('input');
      input.className = 'comment';
      input.placeholder = 'comment…';
      input.id = 'c' + p.number;
      actions.appendChild(input);

      const commentBtn = document.createElement('button');
      commentBtn.className = 'secondary';
      commentBtn.textContent = 'Comment';
      commentBtn.addEventListener('click', () => comment(p.number));
      actions.appendChild(commentBtn);

      if (p.html_url) {
        const a = document.createElement('a');
        a.className = 'link';
        a.href = txt(p.html_url);
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = 'open in browser';
        actions.appendChild(a);
      }

      wrap.appendChild(actions);
      return wrap;
    }
    function render(prs) {
      const el = document.getElementById('list');
      const empty = document.getElementById('empty');
      el.textContent = '';
      if (!prs || !prs.length) { empty.textContent = 'No PRs.'; return; }
      empty.textContent = '';
      const frag = document.createDocumentFragment();
      (Array.isArray(prs) ? prs : []).forEach(p => frag.appendChild(makePr(p)));
      el.appendChild(frag);
    }
    function act(op, number) {
      if (!Number.isInteger(number)) return;
      try { openidea.postMessage(JSON.stringify({ op: op, number: number })); } catch (e) {}
    }
    function comment(number) {
      if (!Number.isInteger(number)) return;
      const inp = document.getElementById('c' + number);
      const text = inp ? inp.value : '';
      try { openidea.postMessage(JSON.stringify({ op: 'comment', number: number, text: String(text) })); } catch (e) {}
      if (inp) inp.value = '';
    }
    function refresh() {
      try { openidea.postMessage(JSON.stringify({ op: 'list', state: currentState })); } catch (e) {}
    }
    document.querySelectorAll('.filters button').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.filters button').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        currentState = b.dataset.state;
        refresh();
      });
    });
    openidea.onMessage((raw) => {
      try {
        const msg = JSON.parse(raw);
        if (msg.op === 'prs') {
          let prs = [];
          try { prs = JSON.parse(msg.data); } catch (e) { prs = []; }
          render(prs);
        }
        if (msg.op === 'error') {
          const empty = document.getElementById('empty');
          if (empty) empty.textContent = 'Error: ' + (msg.message || 'unknown');
        }
      } catch (e) {}
    });
    document.getElementById('refresh').addEventListener('click', refresh);
    refresh();
  </script>
</body>
</html>
